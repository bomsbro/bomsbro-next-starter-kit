name: Server Setup

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_EC2_SECRET_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.AWS_EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Install Docker and Docker Compose on EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }} << 'ENDSSH'
          # Update system
          sudo apt-get update
          sudo apt-get upgrade -y

          # Install required packages
          sudo apt-get install -y ca-certificates curl gnupg lsb-release

          # Add Docker's official GPG key
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          sudo chmod a+r /etc/apt/keyrings/docker.gpg

          # Set up the repository
          echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
            $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
            sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

          # Install Docker Engine
          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

          # Add current user to docker group
          sudo usermod -aG docker $USER

          # Start and enable Docker
          sudo systemctl start docker
          sudo systemctl enable docker

          # Create app directory
          mkdir -p ~/app
          ENDSSH

      - name: Copy project files to EC2
        run: |
          scp -o StrictHostKeyChecking=no -r \
            docker-compose.yml \
            Dockerfile \
            .dockerignore \
            nginx \
            package.json \
            pnpm-lock.yaml \
            next.config.ts \
            tsconfig.json \
            postcss.config.mjs \
            src \
            public \
            ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }}:~/app/

      - name: Start Services (HTTP + Portainer)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }} << 'ENDSSH'
          cd ~/app

          # Create certbot directories for later use
          mkdir -p certbot/www certbot/conf

          # Start nginx, app, portainer
          sudo docker compose up -d --build app nginx portainer

          echo "=========================================="
          echo "Setup complete!"
          echo "App: http://bomsbro.com"
          echo "Portainer: http://bomsbro.com:9000"
          echo ""
          echo "Next step: Run 'SSL Init' action to get HTTPS"
          echo "=========================================="
          ENDSSH
