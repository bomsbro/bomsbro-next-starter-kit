name: SSL Init

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email for Let''s Encrypt SSL certificate'
        required: true
        type: string

env:
  DOMAIN: bomsbro.com

jobs:
  ssl-init:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_EC2_SECRET_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.AWS_EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Request SSL Certificate and Enable HTTPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }} << ENDSSH
          cd ~/app

          # Request SSL certificate (replaces dummy cert)
          sudo docker compose run --rm certbot certonly \
            --webroot \
            --webroot-path=/var/www/certbot \
            --email ${{ inputs.email }} \
            --agree-tos \
            --no-eff-email \
            -d $DOMAIN \
            -d www.$DOMAIN

          # Reload nginx to use new certificate
          sudo docker compose exec nginx nginx -s reload

          echo "=========================================="
          echo "SSL setup complete!"
          echo "App: https://bomsbro.com"
          echo "=========================================="
          ENDSSH
